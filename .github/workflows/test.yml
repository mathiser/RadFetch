name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radfetch
          POSTGRES_PASSWORD: radfetch
          POSTGRES_DB: radfetch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radfetch" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest
        env:
          RADFETCH_TEST_DATABASE_URL: postgresql://radfetch:radfetch@localhost:5432/radfetch_test
      - name: Build image
        run: docker build -t radfetch:ci .
      - name: Validate example flows inside the image
        run: docker run --rm -v "$PWD/flows:/flows:ro" radfetch:ci check-flows
