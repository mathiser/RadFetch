name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radfetch
          POSTGRES_PASSWORD: radfetch
          POSTGRES_DB: radfetch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radfetch" --health-interval 5s --health-retries 12
      orthanc:
        image: orthancteam/orthanc:latest
        env:
          ORTHANC__DICOM_AET: ORTHANC
          ORTHANC__AUTHENTICATION_ENABLED: "false"
          ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
          DICOM_WEB_PLUGIN_ENABLED: "true"
          # C-MOVE destination: the test process on the runner host
          ORTHANC__DICOM_MODALITIES: '{"radfetch": ["RADFETCH", "host.docker.internal", 11193]}'
        ports:
          - 8042:8042
          - 4242:4242
        options: --add-host=host.docker.internal:host-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - name: Wait for Orthanc
        run: timeout 60 sh -c 'until curl -sf http://localhost:8042/system >/dev/null; do sleep 1; done'
      - run: pytest -rs
        env:
          RADFETCH_TEST_DATABASE_URL: postgresql://radfetch:radfetch@localhost:5432/radfetch_test
          RADFETCH_TEST_ORTHANC_URL: http://localhost:8042
          RADFETCH_TEST_ORTHANC_TLS: "1" # starts its own Orthanc with mutual TLS
      - name: Build image
        run: docker build -t radfetch:local .
      - name: Validate example flows inside the image
        run: docker run --rm -v "$PWD/flows:/flows:ro" radfetch:local check-flows

  smoke:
    # The whole Compose stack against the fake PACS, with a gpu flow under RADFETCH_DEBUG_FAKE_GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/smoke.sh
