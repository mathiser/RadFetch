name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.5.*
      # --strict fails the build on broken links and pages missing from the navigation
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publishes the MkDocs site when Pages is set to Source: GitHub Actions. With the source set to a
    # branch folder (main /docs), GitHub renders docs/ itself and this job has nothing to do.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build type: $type"
          echo "type=$type" >> "$GITHUB_OUTPUT"
      - id: deployment
        if: steps.mode.outputs.type == 'workflow'
        uses: actions/deploy-pages@v4
      - if: steps.mode.outputs.type != 'workflow'
        run: echo "::notice::Pages is not set to 'GitHub Actions', so the MkDocs site was built but not published. GitHub publishes docs/ itself."
