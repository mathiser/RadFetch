# One file per flow; the file stem must equal `name`.
name: example
version: "1"

# A series is fetched when it matches any rule. Only matching series are pulled from the PACS.
select:
  - modality: CT
    series_description: "(?i)thorax" # regular expression, optional
    min_instances: 5
# all (default) or largest (only the matching series with the most instances)
pick: all
# What to do when the accession number maps to several studies: fail (default) or all.
multiple_studies: fail

# Pin by digest in production (image@sha256:...) and pre-pull it on the host.
# Contract: input at /input/<SeriesInstanceUID>/*.dcm (read-only), results written to /output,
# exit code 0 on success. The container has no network by default.
image: busybox:1.36
# Optional; omit to use the image's own entrypoint.
command: ["sh", "-c", "n=$(find /input -type f | wc -l); echo $n > /output/instance_count.txt; echo \"{\\\"instances\\\": $n, \\\"series\\\": $(ls /input | wc -l)}\" > /output/results.json"]
gpu: false
timeout_s: 600
max_attempts: 2
env:
  EXAMPLE_SETTING: "1"

# Where the contents of /output go. `dicom` sends every DICOM file by C-STORE.
destinations:
  - type: directory
    path: /data/results
  # - type: dicom
  #   host: 10.0.0.5
  #   port: 104
  #   ae_title: DEST
  # - type: stow
  #   url: https://pacs.example/dicom-web
  #   token_env: STOW_TOKEN # environment variable of the sender service holding a bearer token

# Optional. With a trigger, studies pushed to the storage SCP (port 11114) also start
# this flow when the series rules above match. Without it, only submitted jobs do.
trigger:
  calling_ae_title: "^CT_" # regular expression on the sender's AE title, optional
