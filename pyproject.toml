[project]
name = "radfetch"
version = "0.1.0"
description = "Throttled DICOM Q/R retrieval and containerized workflow execution"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pynetdicom>=2.1",
    "pydicom>=2.4",
    "docker>=7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radfetch = "radfetch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radfetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
