[project]
name = "radfetch"
version = "0.1.0"
description = "Throttled DICOM Q/R retrieval and containerized workflow execution"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pynetdicom>=2.1",
    "pydicom>=2.4",
    "docker>=7",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "segno>=1.6",
    "signxml>=4",
    "ldap3>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "python-multipart>=0.0.9"]

[project.scripts]
radfetch = "radfetch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radfetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
# B008: FastAPI's Depends(...) and Typer's Option(...) are meant to be called in argument defaults.
ignore = ["B008", "SIM102", "SIM105"]
