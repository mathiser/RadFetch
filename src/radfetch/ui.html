<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadFetch</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1c2430; --muted: #627084; --line: #dfe3e9;
    --accent: #1f6feb; --ok: #1a7f4b; --warn: #b26a00; --bad: #c0362c; --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161c; --panel: #1a2029; --text: #e4e9f0; --muted: #94a1b3; --line: #2c3542;
            --accent: #5b9dff; --ok: #4cc38a; --warn: #e0a341; --bad: #f0776c; --chip: #252d39; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 20px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(260px, 320px) 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
  .chip b { font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea { width: 100%; padding: 6px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  textarea { min-height: 90px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }
  button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--chip); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; margin-top: 10px; }
  button.small { padding: 2px 8px; font-size: 12px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tbody tr.job { cursor: pointer; } tbody tr.job:hover { background: var(--chip); }
  td.err { white-space: normal; max-width: 320px; color: var(--bad); }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .bar select { width: auto; }
  #msg { min-height: 18px; font-size: 12px; margin-top: 8px; }
  #detail pre { margin: 0; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>RadFetch</h1>
  <div class="chips" id="counts"></div>
  <div class="chips" id="gateway"></div>
</header>
<main>
  <div>
    <section>
      <h2>One-off job</h2>
      <form id="job-form">
        <label for="acc">Accession number</label><input id="acc" required autocomplete="off">
        <label for="job-flow">Flow</label><select id="job-flow" class="flows"></select>
        <button class="primary">Run now</button>
      </form>
    </section>
    <section>
      <h2>Batch</h2>
      <form id="batch-form">
        <label for="batch-name">Name</label><input id="batch-name" required autocomplete="off">
        <label for="batch-flow">Flow</label><select id="batch-flow" class="flows"></select>
        <label for="batch-acc">Accession numbers, one per line</label><textarea id="batch-acc" required></textarea>
        <button class="primary">Queue batch</button>
      </form>
      <div id="msg"></div>
    </section>
  </div>
  <div>
    <section>
      <h2>Batches</h2>
      <div class="scroll"><table><thead><tr><th>Name</th><th>Flow</th><th>Progress</th><th>Created</th><th></th></tr></thead>
      <tbody id="batches"></tbody></table></div>
    </section>
    <section>
      <div class="bar"><h2 style="margin:0">Jobs</h2>
        <select id="state-filter"><option value="">all states</option></select>
        <span class="muted" id="updated"></span></div>
      <div class="scroll"><table><thead><tr><th>Accession</th><th>Flow</th><th>State</th><th>Source</th><th>Updated</th><th>Error</th><th></th></tr></thead>
      <tbody id="jobs"></tbody></table></div>
    </section>
    <section id="detail" hidden><h2>Job history</h2><pre id="detail-body"></pre></section>
  </div>
</main>
<script>
const STATES = ["queued", "retrieving", "ready", "running", "sending", "done", "failed", "cancelled"];
const TONE = { done: "ok", failed: "bad", cancelled: "muted", running: "warn" };
const $ = (id) => document.getElementById(id);
let selectedJob = null;

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

async function api(path, options = {}) {
  let token = null;
  try { token = sessionStorage.getItem("radfetch-token"); } catch {}
  const headers = { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) };
  const response = await fetch(path, { ...options, headers });
  if (response.status === 401) {
    const entered = prompt("API token");
    if (!entered) throw new Error("not authorized");
    try { sessionStorage.setItem("radfetch-token", entered); } catch {}
    return api(path, options);
  }
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch {}
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return response.json();
}

const post = (path, body) => api(path, { method: "POST", body: body ? JSON.stringify(body) : undefined });
const when = (iso) => new Date(iso).toLocaleString([], { dateStyle: "short", timeStyle: "medium" });

function say(text, tone = "ok") { $("msg").className = tone; $("msg").textContent = text; }

async function act(fn, done) {
  try { await fn(); if (done) say(done); await refresh(); } catch (e) { say(e.message, "bad"); }
}

function renderHealth(h) {
  $("counts").replaceChildren(...STATES.filter((s) => h.jobs[s]).map((s) =>
    el("span", { className: "chip " + (TONE[s] || "") }, s + " ", el("b", {}, String(h.jobs[s])))));
  const g = h.status.gateway, chips = [];
  if (!g) chips.push(el("span", { className: "chip muted" }, "gateway: no heartbeat yet"));
  else {
    const stale = g.age_s > 120;
    chips.push(el("span", { className: "chip " + (stale ? "bad" : "ok") }, stale ? `gateway silent ${Math.round(g.age_s)}s` : "gateway up"));
    chips.push(el("span", { className: "chip " + (g.breaker_open ? "bad" : "ok") }, g.breaker_open ? "PACS breaker open" : "PACS reachable"));
    chips.push(el("span", { className: "chip " + (g.batch_window_open ? "ok" : "warn") }, g.batch_window_open ? "batch window open" : "batch window closed"));
  }
  $("gateway").replaceChildren(...chips);
}

function renderBatches(batches) {
  $("batches").replaceChildren(...batches.map((b) => {
    const total = Object.values(b.jobs).reduce((a, n) => a + n, 0);
    const finished = (b.jobs.done || 0) + (b.jobs.failed || 0) + (b.jobs.cancelled || 0);
    const progress = `${b.jobs.done || 0}/${total} done` + (b.jobs.failed ? `, ${b.jobs.failed} failed` : "") + (b.paused ? " (paused)" : "");
    const buttons = el("td");
    if (finished < total) {
      buttons.append(
        el("button", { className: "small", onclick: () => act(() => post(`/batches/${b.id}/${b.paused ? "resume" : "pause"}`)) }, b.paused ? "Resume" : "Pause"), " ",
        el("button", { className: "small", onclick: () => confirm(`Cancel batch "${b.name}"?`) && act(() => post(`/batches/${b.id}/cancel`)) }, "Cancel"));
    }
    return el("tr", {}, el("td", {}, b.name), el("td", {}, b.flow), el("td", {}, progress), el("td", {}, when(b.created_at)), buttons);
  }));
  if (!batches.length) $("batches").append(el("tr", {}, el("td", { colSpan: 5, className: "muted" }, "No batches yet.")));
}

function renderJobs(jobs) {
  $("jobs").replaceChildren(...jobs.map((j) => {
    const cancel = el("td");
    if (!["done", "failed", "cancelled"].includes(j.state)) {
      cancel.append(el("button", { className: "small", onclick: (e) => { e.stopPropagation(); act(() => post(`/jobs/${j.id}/cancel`)); } }, "Cancel"));
    }
    return el("tr", { className: "job", onclick: () => { selectedJob = j.id; showJob(); } },
      el("td", { className: "mono" }, j.accession_number || "(none)"), el("td", {}, j.flow),
      el("td", { className: TONE[j.state] || "" }, j.state), el("td", {}, j.source),
      el("td", {}, when(j.updated_at)), el("td", { className: "err" }, j.error || ""), cancel);
  }));
  if (!jobs.length) $("jobs").append(el("tr", {}, el("td", { colSpan: 7, className: "muted" }, "No jobs.")));
}

async function showJob() {
  if (!selectedJob) return;
  const j = await api(`/jobs/${selectedJob}`);
  const lines = [`${j.accession_number}  ${j.flow}${j.flow_version ? " v" + j.flow_version : ""}  ${j.state}`,
    `job ${j.id}`, j.study_instance_uid ? `study ${j.study_instance_uid}` : "", ""];
  for (const e of j.events) {
    const detail = Object.keys(e.detail).length ? "  " + JSON.stringify(e.detail) : "";
    lines.push(`${when(e.at)}  ${e.kind}${detail}`);
  }
  $("detail-body").textContent = lines.filter((l, i) => l || i === 3).join("\n");
  $("detail").hidden = false;
}

async function refresh() {
  const state = $("state-filter").value;
  const [health, batches, jobs] = await Promise.all([
    api("/healthz"), api("/batches"), api("/jobs?limit=100" + (state ? "&state=" + state : ""))]);
  renderHealth(health); renderBatches(batches); renderJobs(jobs);
  $("updated").textContent = "updated " + new Date().toLocaleTimeString();
  await showJob();
}

async function init() {
  $("state-filter").append(...STATES.map((s) => el("option", { value: s }, s)));
  $("state-filter").onchange = () => refresh().catch((e) => say(e.message, "bad"));
  const flows = await api("/flows");
  for (const select of document.querySelectorAll(".flows")) select.append(...flows.map((f) => el("option", {}, f)));
  $("job-form").onsubmit = (e) => { e.preventDefault(); act(async () => {
    await post("/jobs", { accession_number: $("acc").value, flow: $("job-flow").value }); $("acc").value = ""; }, "Job submitted."); };
  $("batch-form").onsubmit = (e) => { e.preventDefault(); act(async () => {
    const accession_numbers = $("batch-acc").value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
    await post("/batches", { name: $("batch-name").value, flow: $("batch-flow").value, accession_numbers });
    $("batch-name").value = $("batch-acc").value = ""; }, "Batch queued."); };
  await refresh();
  setInterval(() => refresh().catch((e) => say(e.message, "bad")), 5000);
}
init().catch((e) => say(e.message, "bad"));
</script>
</body>
</html>
